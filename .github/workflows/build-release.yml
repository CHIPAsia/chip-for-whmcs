name: Build and Release

on:
  pull_request:
    types: [opened, synchronize]
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get version
        id: get_version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=pr-${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release Archive
        run: |
          zip -r chip-for-whmcs-${{ steps.get_version.outputs.VERSION }}.zip modules/ LICENSE
          # Also publish a VERSION-INDEPENDENT copy. GitHub resolves
          # /releases/latest/download/<asset> against the LATEST release, so a versioned name
          # (chip-for-whmcs-v1.7.4.zip) starts returning 404 the moment the next release is
          # published. This stable name gives merchants one permanent download URL.
          cp chip-for-whmcs-${{ steps.get_version.outputs.VERSION }}.zip chip-for-whmcs.zip

      - name: Upload Artifact (PR)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: chip-for-whmcs-${{ steps.get_version.outputs.VERSION }}
          path: chip-for-whmcs-${{ steps.get_version.outputs.VERSION }}.zip

      - name: Create Release and Upload Asset (Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            chip-for-whmcs-${{ steps.get_version.outputs.VERSION }}.zip
            chip-for-whmcs.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
